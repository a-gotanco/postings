<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posting</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #16161a; --muted: #6b6b73; --line: #e4e2dc;
    --accent: #0a66c2; --new: #fff6d6; --live: #18a957;
    --c1: #3b5bdb; --c2: #0c8f6b; --c3: #b5503a; --c4: #8a4fd6; --c5: #c27c0e; --c6: #0b8aa8; --c7: #c2437b; --c8: #5b6b2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111114; --panel:#1a1a1f; --ink:#ececef; --muted:#9a9aa3; --line:#2a2a31; --new:#2d2816; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 20px 28px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; font-weight: 700; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live);
         box-shadow: 0 0 0 0 rgba(24,169,87,.5); animation: pulse 2s infinite; }
  .dot.checking { background: #e0a100; }
  .dot.error { background: #d64545; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(24,169,87,0); } 100% { box-shadow: 0 0 0 0 rgba(24,169,87,0); } }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 6px;
                font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--bg); }
  input[type=search] { font: inherit; font-size: 13px; padding: 7px 11px; width: 200px; color: var(--ink);
                       background: var(--panel); border: 1px solid var(--line); border-radius: 8px; outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  .err { width: 100%; color: #d64545; font-size: 12px; }

  main { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(280px, 1fr)); gap: 18px;
         padding: 20px 28px 40px; overflow-x: auto; }
  .btn { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
         border: 1px solid var(--line); background: var(--panel); color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .note { width: 100%; font-size: 12.5px; color: var(--ink); background: var(--new); border-radius: 8px; padding: 8px 12px; }

  /* settings drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 21;
            background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column;
            box-shadow: -12px 0 32px rgba(0,0,0,.12); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px;
                 border-bottom: 1px solid var(--line); }
  .drawer-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  .x { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
  .drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
               margin: 20px 0 8px; }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; padding: 8px 8px 8px 12px; }
  .item .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .item .name { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 12px; }
  .item button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 6px; }
  .item button:hover { color: #d64545; }
  .add { display: flex; gap: 6px; margin-top: 8px; }
  .add input, .field input { flex: 1; font: inherit; font-size: 13px; padding: 8px 11px; color: var(--ink); min-width: 0;
               background: var(--panel); border: 1px solid var(--line); border-radius: 8px; outline: none; }
  .add input:focus, .field input:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint a { color: var(--accent); }
  .warn { color: #b5503a; }
  .field { display: flex; gap: 6px; }
  .drawer-foot { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  .drawer-foot .msg { flex: 1; font-size: 12.5px; color: var(--muted); }
  .drawer-foot .msg.bad { color: #d64545; }
  .drawer-foot .msg.good { color: var(--live); }
  .catseg { display: none; }
  @media (max-width: 900px) {
    header { position: static; padding: 16px 16px 12px; gap: 10px; }
    .controls { margin-left: 0; width: 100%; flex-direction: column; align-items: stretch; }
    .seg.catseg { order: -1; }
    .seg { overflow-x: auto; }
    .seg button { flex: 1; white-space: nowrap; padding: 7px 8px; }
    input[type=search] { width: 100%; }
    .catseg { display: flex; }
    main { grid-template-columns: 1fr; padding: 12px 16px 32px; }
    .col { max-height: none; }
    .col:not(.active) { display: none; }
  }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
         display: flex; flex-direction: column; max-height: calc(100vh - 120px); }
  .col-head { display: flex; align-items: baseline; justify-content: space-between;
              padding: 14px 16px 12px; border-bottom: 1px solid var(--line); border-top: 3px solid var(--cc); }
  .col-head h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .list { overflow-y: auto; }
  .day { position: sticky; top: 0; background: var(--panel); padding: 10px 16px 4px;
         font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  a.job { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 16px;
          border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; transition: background .15s; }
  a.job:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  a.job.fresh { background: var(--new); }
  .title { font-weight: 600; font-size: 14px; }
  .meta { grid-column: 1; color: var(--muted); font-size: 12.5px; }
  .company { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right;
             display: flex; align-items: center; gap: 8px; max-width: 160px; }
  .company span { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo { width: 28px; height: 28px; border-radius: 6px; flex: none; background: var(--line);
          display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted);
          object-fit: cover; }
  .empty { padding: 28px 16px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Posting</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  <div class="controls">
    <div class="seg catseg" id="catSeg"></div>
    <div class="seg" id="metroSeg"></div>
    <input type="search" id="q" placeholder="Filter title or company">
    <button class="btn" id="editBtn">Edit searches</button>
  </div>
  <div class="note" id="note" hidden></div>
  <div class="err" id="err" hidden></div>
</header>
<main id="board"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Edit searches">
  <div class="drawer-head"><h2>Edit searches</h2><button class="x" id="closeBtn" aria-label="Close">×</button></div>
  <div class="drawer-body">
    <h3>Job titles</h3>
    <div class="items" id="titleList"></div>
    <form class="add" id="titleForm"><input id="titleIn" placeholder="Add a job title, e.g. Product Manager" maxlength="60"><button class="btn">Add</button></form>
    <div class="hint">Each title becomes a column. A job is kept only if this phrase is in its title.</div>

    <h3>Locations</h3>
    <div class="items" id="locList"></div>
    <form class="add" id="locForm"><input id="locIn" placeholder="Add a city, e.g. Austin, TX — or Remote" maxlength="80"><button class="btn">Add</button></form>
    <div class="hint" id="countHint"></div>

    <h3>GitHub access</h3>
    <div id="tokenBox"></div>
  </div>
  <div class="drawer-foot">
    <span class="msg" id="saveMsg"></span>
    <button class="btn primary" id="saveBtn" disabled>Save</button>
  </div>
</aside>

<script>
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
let data = null, cfg = null, metro = "all", query = "", activeCat = null;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("posting-seen") || "[]")); } catch {}
const firstLoad = seen.size === 0;

const ago = iso => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const dayLabel = iso => {
  const d = new Date(iso), t = new Date();
  const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const titles = () => (cfg && cfg.titles) || Object.entries(data.categories).map(([id, name]) => ({ id, name }));
const locations = () => (cfg && cfg.locations) || Object.entries(data.metros).map(([id, name]) => ({ id, name }));
const metroName = id => (locations().find(l => l.id === id) || {}).name || "";

function renderMetros() {
  const seg = document.getElementById("metroSeg");
  if (metro !== "all" && !locations().some(l => l.id === metro)) metro = "all";
  const opts = [["all", "All"], ...locations().map(l => [l.id, l.name])];
  seg.innerHTML = opts.map(([k, v]) => `<button data-k="${k}" class="${k === metro ? "on" : ""}">${esc(v)}</button>`).join("");
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { metro = b.dataset.k; render(); });
}

function renderCats() {
  const seg = document.getElementById("catSeg");
  const short = { corpdev: "Corp Dev", stratfin: "Strat Fin", invassoc: "Inv Assoc" };
  if (!titles().some(t => t.id === activeCat)) activeCat = (titles()[0] || {}).id;
  seg.innerHTML = titles().map(({ id: k, name: v }) =>
    `<button data-k="${k}" class="${k === activeCat ? "on" : ""}">${esc(short[k] || v)}</button>`).join("");
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { activeCat = b.dataset.k; render(); });
}

function render() {
  if (!data) return;
  renderMetros(); renderCats();
  const q = query.toLowerCase();
  const board = document.getElementById("board");
  const locIds = new Set(locations().map(l => l.id));
  board.style.setProperty("--n", Math.max(1, titles().length));
  board.innerHTML = titles().map(({ id: cat, name }, i) => {
    const jobs = data.jobs.filter(j => j.category === cat && locIds.has(j.metro)
      && (metro === "all" || j.metro === metro)
      && (!q || (j.title + " " + j.company).toLowerCase().includes(q)));
    let lastDay = null, rows = "";
    for (const j of jobs) {
      const day = dayLabel(j.first_seen);
      if (day !== lastDay) { rows += `<div class="day">${day}</div>`; lastDay = day; }
      const fresh = !firstLoad && !seen.has(j.id);
      const logo = j.logo ? `<img class="logo" src="${esc(j.logo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo',textContent:'${esc(j.company[0] || "?")}'}))">`
                          : `<div class="logo">${esc((j.company || "?")[0])}</div>`;
      rows += `<a class="job${fresh ? " fresh" : ""}" href="${esc(j.url)}" target="_blank" rel="noopener">
        <div class="title">${esc(j.title)}</div>
        <div class="company"><span title="${esc(j.company)}">${esc(j.company)}</span>${logo}</div>
        <div class="meta">${esc(j.location || metroName(j.metro))} · ${ago(j.first_seen)}</div>
      </a>`;
    }
    return `<section class="col${cat === activeCat ? " active" : ""}" style="--cc:${COLORS[i % COLORS.length]}">
      <div class="col-head"><h2>${esc(name)}</h2><span class="count">${jobs.length}</span></div>
      <div class="list">${rows || `<div class="empty">${!data.last_run || !(cat in data.categories) ? "Waiting for the next check…" : "No postings yet"}</div>`}</div>
    </section>`;
  }).join("");
}

function renderStatus() {
  const dot = document.getElementById("dot"), txt = document.getElementById("statusText"), err = document.getElementById("err");
  dot.className = "dot " + (data.status === "checking" ? "checking" : data.status === "error" ? "error" : "");
  if (data.status === "checking") txt.textContent = "Checking LinkedIn…";
  else if (data.last_run) {
    const mins = data.next_run ? Math.max(0, Math.round((new Date(data.next_run) - Date.now()) / 60000)) : data.poll_minutes;
    txt.textContent = `Live · checked ${ago(data.last_run)} · next ${mins > 0 ? "in " + mins + "m" : "any minute"} · ${data.jobs.length} jobs`;
  } else txt.textContent = "Starting first check…";
  err.hidden = !data.error; err.textContent = data.error ? "Some searches failed: " + data.error : "";
}

const sameSearches = (a, b) => !!a && !!b &&
  JSON.stringify([a.titles.map(t => t.name), a.locations.map(l => l.search || l.name)]) ===
  JSON.stringify([b.titles.map(t => t.name), b.locations.map(l => l.search || l.name)]);

async function loadConfig() {
  let served = null;
  try { served = await (await fetch("config.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch {}
  const pending = store.get("posting-pending", null);
  // after a save, keep showing the new searches until the published site catches up (about a minute)
  if (pending && (!served || !sameSearches(served, pending)) && Date.now() - pending.savedAt < 15 * 60000) cfg = pending;
  else { store.set("posting-pending"); cfg = served; }
}

function renderNote() {
  const note = document.getElementById("note"), pending = store.get("posting-pending", null);
  const waiting = pending && cfg === pending ||
    data && titles().some(t => !(t.id in data.categories)) || data && locations().some(l => !(l.id in data.metros));
  note.hidden = !waiting;
  note.textContent = "Searches updated — new results will appear after the next LinkedIn check (usually 2–5 minutes).";
}

async function poll() {
  try {
    const [r] = await Promise.all([fetch("jobs.json?t=" + Date.now(), { cache: "no-store" }), loadConfig()]);
    data = await r.json();
    renderStatus(); render(); renderNote();
    // mark everything currently shown as seen after a short delay, so new ones stay highlighted this visit
    setTimeout(() => {
      data.jobs.forEach(j => seen.add(j.id));
      try { localStorage.setItem("posting-seen", JSON.stringify([...seen].slice(-5000))); } catch {}
    }, 4000);
  } catch {
    document.getElementById("statusText").textContent = "Can't load the job log right now — retrying…";
    document.getElementById("dot").className = "dot error";
  }
}
document.getElementById("q").oninput = e => { query = e.target.value; render(); };

/* ---------------- Edit searches ---------------- */
const $ = id => document.getElementById(id);
let draft = null;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "x";
const uniqueId = (name, list) => { let id = slug(name), n = 2; while (list.some(x => x.id === id)) id = slug(name) + "-" + n++; return id; };
const repo = () => (cfg && cfg.repo) || "a-gotanco/postings";
const token = () => store.get("posting-gh-token", "");

function openDrawer() {
  const base = cfg || { titles: titles(), locations: locations() };
  draft = JSON.parse(JSON.stringify({ repo: repo(), titles: base.titles, locations: base.locations }));
  $("saveMsg").textContent = ""; $("saveMsg").className = "msg";
  $("drawer").hidden = $("scrim").hidden = false;
  renderDrawer();
}
function closeDrawer() { $("drawer").hidden = $("scrim").hidden = true; }

function dirty() {
  const now = cfg || { titles: titles(), locations: locations() };
  return JSON.stringify([draft.titles, draft.locations]) !== JSON.stringify([now.titles, now.locations]);
}

function renderDrawer() {
  $("titleList").innerHTML = draft.titles.map((t, i) => `<div class="item">
      <span class="swatch" style="background:${COLORS[i % COLORS.length]}"></span>
      <span class="name">${esc(t.name)}</span>
      <button data-i="${i}" aria-label="Remove ${esc(t.name)}" title="Remove">×</button></div>`).join("")
    || `<div class="hint">No titles yet — add at least one.</div>`;
  $("locList").innerHTML = draft.locations.map((l, i) => `<div class="item">
      <span class="name">${esc(l.name)}</span>
      ${l.search && l.search !== l.name ? `<span class="sub">${esc(l.search)}</span>` : ""}
      <button data-i="${i}" aria-label="Remove ${esc(l.name)}" title="Remove">×</button></div>`).join("")
    || `<div class="hint">No locations yet — add at least one.</div>`;
  $("titleList").querySelectorAll("button").forEach(b => b.onclick = () => { draft.titles.splice(+b.dataset.i, 1); renderDrawer(); });
  $("locList").querySelectorAll("button").forEach(b => b.onclick = () => { draft.locations.splice(+b.dataset.i, 1); renderDrawer(); });

  const n = draft.titles.length * draft.locations.length;
  $("countHint").innerHTML = `Type a city the way you'd search LinkedIn (e.g. <i>Austin, TX</i>), or <i>Remote</i> for US remote jobs.<br>` +
    `${n} search${n === 1 ? "" : "es"} per check` + (n > 30 ? ` — <span class="warn">that's a lot; LinkedIn may start blocking. Try to keep it under 30.</span>` : ".");

  $("tokenBox").innerHTML = token()
    ? `<div class="item"><span class="name">Connected on this device</span><button id="forget" title="Disconnect">×</button></div>
       <div class="hint">Saving updates <b>config.json</b> in ${esc(repo())}.</div>`
    : `<div class="field"><input id="tokenIn" type="password" placeholder="Paste a GitHub token" autocomplete="off"></div>
       <div class="hint">Saving writes to your GitHub repo, so this device needs a token once.
       <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a fine-grained token</a>:
       Repository access → <b>Only select repositories</b> → <b>${esc(repo().split("/")[1])}</b>; Permissions → <b>Contents: Read and write</b>.
       It's stored only in this browser.<br>
       No token? <a href="https://github.com/${esc(repo())}/edit/main/config.json" target="_blank" rel="noopener">Edit config.json on GitHub</a> instead.</div>`;
  const f = $("forget"); if (f) f.onclick = () => { store.set("posting-gh-token"); renderDrawer(); };
  const ti = $("tokenIn"); if (ti) ti.oninput = updateSave;
  updateSave();
}

function updateSave() {
  const ti = $("tokenIn");
  const ok = draft.titles.length > 0 && draft.locations.length > 0 && (token() || (ti && ti.value.trim()));
  $("saveBtn").disabled = !(dirty() && ok);
}

function addFrom(input, list, make) {
  const v = input.value.trim().replace(/\s+/g, " ");
  if (!v) return;
  const item = make(v);
  if (list.some(x => x.name.toLowerCase() === item.name.toLowerCase() && (x.search || x.name).toLowerCase() === (item.search || item.name).toLowerCase())) {
    $("saveMsg").textContent = `"${v}" is already in the list.`; $("saveMsg").className = "msg bad"; return;
  }
  list.push(item); input.value = ""; $("saveMsg").textContent = ""; renderDrawer(); input.focus();
}
$("titleForm").onsubmit = e => { e.preventDefault(); addFrom($("titleIn"), draft.titles, v => ({ id: uniqueId(v, draft.titles), name: v })); };
$("locForm").onsubmit = e => {
  e.preventDefault();
  addFrom($("locIn"), draft.locations, v => {
    const remote = /^remote\b/i.test(v);
    const name = remote ? "Remote" : v.split(",")[0].trim();
    return { id: uniqueId(name, draft.locations), name, search: remote ? "Remote" : v };
  });
};

const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

async function save() {
  const ti = $("tokenIn"), tok = token() || (ti && ti.value.trim());
  const msg = $("saveMsg");
  $("saveBtn").disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
  const api = `https://api.github.com/repos/${repo()}/contents/config.json`;
  const headers = { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" };
  try {
    const cur = await fetch(api + "?ref=main&t=" + Date.now(), { headers, cache: "no-store" });
    if (cur.status === 401) throw new Error("GitHub didn't accept that token. Check it was copied fully and hasn't expired.");
    if (cur.status === 404 || cur.status === 403) throw new Error("That token can't access " + repo() + ". Give it Contents: Read and write on that repo.");
    const sha = cur.ok ? (await cur.json()).sha : undefined;
    const body = JSON.stringify({ repo: repo(), titles: draft.titles, locations: draft.locations }, null, 2) + "\n";
    const put = await fetch(api, { method: "PUT", headers, body: JSON.stringify({
      message: "Update searches: " + draft.titles.map(t => t.name).join(", ") + " in " + draft.locations.map(l => l.name).join(", "),
      content: b64(body), branch: "main", ...(sha ? { sha } : {}) }) });
    if (!put.ok) {
      const e = await put.json().catch(() => ({}));
      throw new Error(put.status === 403 || put.status === 404
        ? "That token can read but not write. Give it Contents: Read and write."
        : put.status === 409 ? "Someone changed the searches at the same time — close and try again."
        : "GitHub said: " + (e.message || put.status));
    }
    if (!token()) store.set("posting-gh-token", tok);
    cfg = { repo: repo(), titles: draft.titles, locations: draft.locations, savedAt: Date.now() };
    store.set("posting-pending", cfg);
    msg.className = "msg good"; msg.textContent = "Saved. A LinkedIn check is starting now.";
    render(); renderNote(); renderDrawer();
    setTimeout(closeDrawer, 1200);
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = e.message || "Couldn't reach GitHub. Try again.";
    updateSave();
  }
}

$("editBtn").onclick = openDrawer;
$("closeBtn").onclick = $("scrim").onclick = closeDrawer;
$("saveBtn").onclick = save;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
poll();
setInterval(poll, 60000);
</script>
</body>
